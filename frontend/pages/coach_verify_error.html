<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/static/images/favicon.png">
  <title>Verification Failed — SAIL Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#050d1a;--teal:#00c9a7;--teal-g:rgba(0,201,167,0.12);--gold:#e8b84b;--text-1:#f0eee8;--text-2:#8fa0b8;--border-s:rgba(255,255,255,0.07);--ease:cubic-bezier(0.16,1,0.3,1);}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Lora',Georgia,serif;background:var(--navy);color:var(--text-1);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(0,201,167,0.06) 0%,transparent 55%);}
    .card{position:relative;z-index:1;background:rgba(12,24,41,0.9);border:1px solid var(--border-s);border-radius:20px;padding:3rem 2.5rem;max-width:480px;width:100%;text-align:center;}
    .icon{font-size:3rem;margin-bottom:1.25rem;}
    h1{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--gold);margin-bottom:.75rem;}
    p{color:var(--text-2);font-size:.92rem;line-height:1.7;margin-bottom:1.75rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;font-family:'Syne',sans-serif;font-weight:600;font-size:.85rem;padding:.7rem 1.4rem;border-radius:10px;border:none;cursor:pointer;transition:all .2s var(--ease);text-decoration:none;background:var(--teal);color:var(--navy);}
    .btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,201,167,0.3);}
    .btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border-s);margin-right:.5rem;}
    .btn-ghost:hover{color:var(--teal);background:var(--teal-g);box-shadow:none;}
  </style>
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<div class="card">
  <div class="icon">⚠️</div>
  <h1>Link Expired or Invalid</h1>
  <p>This verification link is either invalid or has expired (links are valid for 24 hours). Please log in and request a new verification email.</p>
  <div>
    <a href="/login" class="btn btn-ghost">Log In</a>
    <a href="/coach/postings" class="btn">Go to My Postings →</a>
  </div>
</div>
</body>
</html>
